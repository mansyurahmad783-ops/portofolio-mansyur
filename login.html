<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Ahmad Mansyur</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                AM
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Silakan login untuk masuk ke portfolio
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label>Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                    >

                </div>


                <div class="remember">

                    <label>
                        <input type="checkbox" id="remember">
                        Ingat saya
                    </label>

                </div>


                <button type="submit">
                    Login
                </button>


                <p id="message"></p>

            </form>


            <div class="back">

                <a href="index.html">
                    ← Kembali ke Portfolio
                </a>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
